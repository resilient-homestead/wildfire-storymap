<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homestead Valley Wildfire StoryMap â€” Prototype</title>

  <!-- A theme is more than a palette here: it sets the page background,
       surface treatment, hero scrim and nav colours through a block of custom
       properties. Serpentine is the only registered theme and its set is
       :root in css/style.css, so there is nothing to guess today and this
       runs as a no-op. It stays because story.js can only set
       html[data-theme] after chapters.json has loaded: the moment a second
       theme is registered, a reader whose saved preference is the non-default
       one would get a flash of Serpentine first. This guesses the attribute
       from the same two sources story.js checks (?theme=, then the saved
       preference) so the very first paint is already right. Add new theme
       names to `known` alongside the chapters.json entry; story.js remains
       authoritative. -->
  <script>
    (function () {
      var known = ["serpentine"];
      var name = null;
      try {
        name = new URLSearchParams(location.search).get("theme")
          || localStorage.getItem("storymap-theme");
      } catch (e) {
        /* localStorage throws in private mode and on some file:// URLs */
      }
      if (known.indexOf(name) !== -1) document.documentElement.dataset.theme = name;
    })();
  </script>

  <!-- Each theme in data/chapters.json "themes" declares its own font pairing
       and the Google Fonts URL that serves it; applyTheme() in js/story.js
       injects that stylesheet when the theme is applied. Only the default
       pairing is loaded statically here, so first paint isn't waiting on
       fonts the reader may never see. This must stay in step with
       Serpentine's fontsHref and the --font-heading / --font-body pair on
       :root, or the page paints in a fallback face and reflows. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />

  <link href="https://unpkg.com/maplibre-gl@^4/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="css/style.css?v=72" rel="stylesheet" />
</head>
<body>

  <div id="header">
    <h1>Homestead Valley Wildfire StoryMap</h1>
  </div>

  <div id="map">
    <div class="map-controls">
      <!-- data-tip rather than title= on every control in this block: the
           tooltips are drawn by CSS (see the Tooltips section in
           css/style.css) so they scale with --ui-scale, appear for
           keyboard focus too, and can carry a full instruction. They point
           LEFT because #map is overflow: hidden and these sit 1rem off its
           right edge. aria-label stays - it is what a screen reader
           actually announces. -->
      <button type="button" id="map-fullscreen-btn" class="map-control-btn map-control-fullscreen" aria-label="Toggle fullscreen map" data-tip="Click for fullscreen map" data-tip-pos="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <div class="map-control-stack">
        <!-- The rose inside the plate is what rotates: initNorthArrow() in
             js/story.js re-aims it on every bearing change, so the "N" and
             the needle stay pointing at true north when a reader
             drag-rotates the camera. -->
        <div class="map-north-arrow" title="North" aria-hidden="true">
          <div class="map-north-rose" id="map-north-rose">
            <span class="map-north-label">N</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2 20 22 12 17.4Z" fill="currentColor" />
              <path d="M12 2 20 22 12 17.4 4 22Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
        <button type="button" id="map-home-btn" class="map-control-btn" aria-label="Reset map view" data-tip="Click to return to this chapter's starting view" data-tip-pos="left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        </button>
        <div class="map-control-zoom-group">
          <button type="button" id="map-zoom-in-btn" class="map-control-btn" aria-label="Zoom in" data-tip="Click to zoom in" data-tip-pos="left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button type="button" id="map-zoom-out-btn" class="map-control-btn" aria-label="Zoom out" data-tip="Click to zoom out" data-tip-pos="left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
          </button>
        </div>
      </div>
    </div>
    <!-- Cartographic title for whichever map chapter currently owns the
         band. Filled by updateMapTitle() in js/story.js from the chapter's
         "mapTitle" (falling back to its narrative title), because one
         MapLibre instance serves every map chapter and the thing on screen
         changes completely between them - elevation, then vegetation, then
         roads. The narrative <h2> below the band answers "why am I looking
         at this"; this answers "what am I looking at". -->
    <div class="map-title" id="map-title"></div>
    <!-- Key for the on-map wind arrows. The arrows themselves are MapLibre
         markers pinned to real coordinates, spaced along a curved streamline
         per scenario and each rotated to that curve's local tangent, so they
         drift the way the air actually bends through the valley - see
         WIND_FLOWS / buildWindArrows() in js/story.js. Both the key and the
         arrows are shown/hidden per chapter via chapter.layers.wind. -->
    <div class="wind-indicator" id="wind-indicator" aria-hidden="true">
      <span class="wind-key-item wind-key-diablo">Diablo Wind <small>offshore &middot; NE&rarr;SW</small></span>
      <span class="wind-key-item wind-key-reverse">Reverse Wind <small>onshore &middot; SW&rarr;NE</small></span>
    </div>
    <!-- Inside #map, not a sibling of it, so it fades out with the map when
         a plain or media-only chapter takes the screen instead of being
         left floating over it, keyed to a map that is no longer shown. -->
    <div id="legend"></div>
    <button type="button" id="legend-reopen" class="legend-reopen" aria-label="Show legend">Open Legend to select your layers</button>
  </div>
  <!-- The media panel: pinned to the viewport and filled by
       placeMediaForChapter() as the reader scrolls. Deliberately a sibling
       of #story rather than a child, because #story is the scrolling
       narrative and this must not scroll with it.

       Like #map above it is viewport-pinned; the two never share the
       screen - whichever scroll region owns it decides which is shown (see
       setupMediaRegions()). A map chapter's photographs open it full width
       in a media-only section after the chapter. It is also the only
       element setupFooterRelease() has to let go of at the end of the
       page: the last map chapter is far from the footer. -->
  <div id="media-sidecar"></div>
  <div id="story"></div>
  <footer id="footer"></footer>

  <script src="https://unpkg.com/maplibre-gl@^4/dist/maplibre-gl.js"></script>
  <script src="js/story.js?v=71"></script>
</body>
</html>
